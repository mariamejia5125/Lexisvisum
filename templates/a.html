<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión / Registro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .forms-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .forms-wrapper {
            position: relative;
            width: 200%;
            height: 100%;
            display: flex;
            transition: transform 0.6s ease-in-out;
        }

        .forms-wrapper.active {
            transform: translateX(-50%);
        }

        .form-panel {
            width: 50%;
            height: 100%;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .login-form {
            background: #ffffff;
        }

        .register-form {
            background: #ffffff;
        }

        .overlay-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .overlay-wrapper {
            position: relative;
            width: 200%;
            height: 100%;
            display: flex;
            transition: transform 0.6s ease-in-out;
            pointer-events: none;
        }

        .overlay-wrapper.active {
            transform: translateX(-50%);
        }

        .overlay-panel {
            width: 50%;
            height: 100%;
            pointer-events: all;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            color: white;
            text-align: center;
        }

        .overlay-left {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .overlay-right {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        h2 {
            margin-bottom: 30px;
            color: #333;
            font-weight: 600;
        }

        .input-group {
            position: relative;
            margin-bottom: 25px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 0;
            border: none;
            border-bottom: 2px solid #ddd;
            outline: none;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            border-bottom-color: #667eea;
        }

        .input-group label {
            position: absolute;
            top: 12px;
            left: 0;
            color: #999;
            font-size: 16px;
            pointer-events: none;
            transition: all 0.3s;
        }

        .input-group input:focus ~ label,
        .input-group input:valid ~ label {
            top: -10px;
            font-size: 12px;
            color: #667eea;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: #5a67d8;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }

        .btn-toggle {
            background: none;
            border: none;
            color: #667eea;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            text-decoration: underline;
            padding: 0;
            margin-left: 5px;
        }

        .btn-toggle:hover {
            color: #5a67d8;
        }

        .overlay-panel h1 {
            font-size: 36px;
            margin-bottom: 20px;
        }

        .overlay-panel p {
            font-size: 16px;
            line-height: 1.5;
            opacity: 0.9;
        }

        .login-form .btn-toggle {
            color: #667eea;
        }

        /* Mensajes de error/success */
        .message {
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 5px;
            font-size: 14px;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="forms-container">
            <div class="forms-wrapper" id="formsWrapper">
                <!-- Formulario de Inicio de Sesión -->
                <div class="form-panel login-form">
                    <h2>Iniciar Sesión</h2>
                    <div id="loginMessage" class="message"></div>
                    <form id="loginForm">
                        <div class="input-group">
                            <input type="email" id="loginEmail" required>
                            <label for="loginEmail">Correo electrónico</label>
                        </div>
                        <div class="input-group">
                            <input type="password" id="loginPassword" required>
                            <label for="loginPassword">Contraseña</label>
                        </div>
                        <button type="submit" class="btn-submit">Iniciar Sesión</button>
                    </form>
                    <div class="register-link">
                        ¿Eres nuevo? <button class="btn-toggle" id="showRegisterBtn">Regístrate</button>
                    </div>
                </div>

                <!-- Formulario de Registro -->
                <div class="form-panel register-form">
                    <h2>Registrarse</h2>
                    <div id="registerMessage" class="message"></div>
                    <form id="registerForm">
                        <div class="input-group">
                            <input type="text" id="registerName" required>
                            <label for="registerName">Nombre completo</label>
                        </div>
                        <div class="input-group">
                            <input type="email" id="registerEmail" required>
                            <label for="registerEmail">Correo electrónico</label>
                        </div>
                        <div class="input-group">
                            <input type="password" id="registerPassword" required minlength="6">
                            <label for="registerPassword">Contraseña</label>
                        </div>
                        <button type="submit" class="btn-submit">Registrarse</button>
                    </form>
                    <div class="register-link">
                        ¿Ya tienes cuenta? <button class="btn-toggle" id="showLoginBtn">Inicia Sesión</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Panel de Overlay -->
        <div class="overlay-container">
            <div class="overlay-wrapper" id="overlayWrapper">
                <!-- Overlay Izquierdo -->
                <div class="overlay-panel overlay-left">
                    <h1>Iniciar Sesión</h1>
                    <p>Accede a tu cuenta para continuar</p>
                </div>

                <!-- Overlay Derecho -->
                <div class="overlay-panel overlay-right">
                    <h1>Iniciar Sesión</h1>
                    <p>Accede a tu cuenta para continuar</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Elementos del DOM
        const formsWrapper = document.getElementById('formsWrapper');
        const overlayWrapper = document.getElementById('overlayWrapper');
        const showRegisterBtn = document.getElementById('showRegisterBtn');
        const showLoginBtn = document.getElementById('showLoginBtn');
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const loginMessage = document.getElementById('loginMessage');
        const registerMessage = document.getElementById('registerMessage');

        // Cambiar a formulario de registro
        showRegisterBtn.addEventListener('click', () => {
            formsWrapper.classList.add('active');
            overlayWrapper.classList.add('active');
        });

        // Cambiar a formulario de login
        showLoginBtn.addEventListener('click', () => {
            formsWrapper.classList.remove('active');
            overlayWrapper.classList.remove('active');
        });

        // Manejar inicio de sesión
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            loginMessage.style.display = 'block';
            
            if (email && password) {
                const users = JSON.parse(localStorage.getItem('users') || '[]');
                const user = users.find(u => u.email === email && u.password === password);
                
                if (user) {
                    loginMessage.className = 'message success';
                    loginMessage.textContent = '¡Inicio de sesión exitoso! Redirigiendo...';
                    
                    localStorage.setItem('currentUser', JSON.stringify(user));
                    
                    setTimeout(() => {
                        alert('Inicio de sesión exitoso! (Simulación)');
                        loginMessage.style.display = 'none';
                    }, 1500);
                } else {
                    loginMessage.className = 'message error';
                    loginMessage.textContent = 'Correo o contraseña incorrectos';
                }
            }
        });

        // Manejar registro
        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('registerName').value;
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;

            registerMessage.style.display = 'block';
            
            if (password.length < 6) {
                registerMessage.className = 'message error';
                registerMessage.textContent = 'La contraseña debe tener al menos 6 caracteres';
                return;
            }

            const users = JSON.parse(localStorage.getItem('users') || '[]');
            
            if (users.some(u => u.email === email)) {
                registerMessage.className = 'message error';
                registerMessage.textContent = 'Este correo ya está registrado';
                return;
            }

            const newUser = {
                id: Date.now(),
                name,
                email,
                password
            };

            users.push(newUser);
            localStorage.setItem('users', JSON.stringify(users));

            registerMessage.className = 'message success';
            registerMessage.textContent = '¡Registro exitoso! Ya puedes iniciar sesión';

            registerForm.reset();

            setTimeout(() => {
                formsWrapper.classList.remove('active');
                overlayWrapper.classList.remove('active');
                registerMessage.style.display = 'none';
                document.getElementById('loginEmail').value = email;
            }, 2000);
        });

        const currentUser = JSON.parse(localStorage.getItem('currentUser'));
        if (currentUser) {
            document.getElementById('loginEmail').value = currentUser.email;
        }
    </script>
</body>
</html>
